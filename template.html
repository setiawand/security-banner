<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b1020;
    --bg2: #111a33;
    --text: #f4f6fb;
    --muted: #8b95b0;
    --accent: #22d3ee;      /* Teknosoup accent — change to your brand color */
    --sev: #ef4444;         /* overwritten by severity */
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: radial-gradient(circle at 85% 30%, var(--bg2) 0%, var(--bg) 60%);
    color: var(--text);
    font-family: "Space Grotesk", system-ui, sans-serif;
    position: relative;
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size: 40px 40px;
    mask-image: linear-gradient(90deg, transparent 0%, #000 55%);
  }
  .bar { position: absolute; left: 0; top: 0; bottom: 0; width: 14px; background: var(--sev); }
  .content {
    position: absolute; left: 80px; top: 70px; width: 690px; height: 490px;
    display: flex; flex-direction: column;
  }
  .kicker {
    display: inline-flex; align-items: center; gap: 12px; align-self: flex-start;
    font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 22px; letter-spacing: 2px;
    color: var(--sev); border: 2px solid var(--sev); border-radius: 8px; padding: 8px 16px;
  }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--sev); }
  h1 {
    margin-top: 36px; font-size: 64px; line-height: 1.08; font-weight: 700; letter-spacing: -1px;
  }
  .cve {
    margin-top: 28px; font-family: "JetBrains Mono", monospace; font-size: 26px; color: var(--accent);
  }
  .footer {
    margin-top: auto; display: flex; align-items: center; gap: 18px;
    font-family: "JetBrains Mono", monospace; font-size: 22px; color: var(--muted);
  }
  .brand { color: var(--text); font-weight: 700; }
  .brand span { color: var(--accent); }
  .icon-wrap {
    position: absolute; right: 90px; top: 50%; transform: translateY(-50%);
    width: 300px; height: 300px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle, rgba(34,211,238,.18) 0%, rgba(34,211,238,0) 70%);
  }
  .icon-wrap::before {
    content: ""; position: absolute; inset: 0; border-radius: 50%;
    border: 2px dashed rgba(34,211,238,.35);
  }
  .icon-wrap svg { width: 170px; height: 170px; stroke: var(--accent); }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="bar"></div>
  <div class="content">
    <div class="kicker"><span class="dot"></span><span id="kicker"></span></div>
    <h1 id="headline"></h1>
    <div class="cve" id="cve"></div>
    <div class="footer">
      <span class="brand">tekno<span>soup</span>.com</span>
      <span>·</span>
      <span>Security News</span>
      <span>·</span>
      <span id="date"></span>
    </div>
  </div>
  <div class="icon-wrap" id="icon"></div>

<script>
  const ICONS = {
    shield: '<path d="M12 2l8 3v6c0 5-3.5 9-8 11-4.5-2-8-6-8-11V5l8-3z"/><path d="M9 12l2 2 4-4"/>',
    lock:   '<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/><circle cx="12" cy="16" r="1.5"/>',
    bug:    '<rect x="8" y="6" width="8" height="14" rx="4"/><path d="M12 10v10M4 13h4M16 13h4M5 7l3 2M19 7l-3 2M5 19l3-2M19 19l-3-2M10 4l1 2M14 4l-1 2"/>',
    alert:  '<path d="M12 3l10 18H2L12 3z"/><path d="M12 10v5"/><circle cx="12" cy="18" r=".8"/>',
    key:    '<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3M15 8l2 2"/>',
    server: '<rect x="3" y="4" width="18" height="7" rx="1.5"/><rect x="3" y="13" width="18" height="7" rx="1.5"/><circle cx="7" cy="7.5" r=".8"/><circle cx="7" cy="16.5" r=".8"/>'
  };
  const SEV = { critical: '#ef4444', high: '#f97316', medium: '#eab308', info: '#22d3ee' };

  // window.BANNER is injected by render_banner.py; defaults allow previewing in a browser.
  const d = Object.assign({
    headline: 'Contoh Judul Banner Keamanan Siber',
    kicker: 'CELAH KEAMANAN', severity: 'high', icon: 'shield', cve: '', date: ''
  }, window.BANNER || {});

  document.getElementById('headline').textContent = d.headline;
  document.getElementById('kicker').textContent = d.kicker;
  document.getElementById('cve').textContent = d.cve || '';
  document.getElementById('date').textContent = d.date || '';
  document.documentElement.style.setProperty('--sev', SEV[d.severity] || SEV.high);
  document.getElementById('icon').innerHTML =
    '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">'
    + (ICONS[d.icon] || ICONS.shield) + '</svg>';
  if (!d.cve) document.getElementById('cve').style.display = 'none';
  document.body.dataset.ready = '1';
</script>
</body>
</html>
